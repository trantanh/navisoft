spring:
  application:
    name: navisoft
  main:
    banner-mode: "off"
    web-application-type: none
  datasource:
    url: ${NAVISOFT_DB_URL:jdbc:mysql://localhost:3306/pricetags?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Prague}
    username: ${NAVISOFT_DB_USERNAME:navisoft}
    password: ${NAVISOFT_DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
      # Legacy JDBC DAOs keep one connection for their lifetime. The pool can
      # be reduced after their gradual replacement with Spring Data repositories.
      maximum-pool-size: 20
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Prague
  flyway:
    enabled: ${NAVISOFT_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    root: INFO
    com.trantanh.navipos: INFO

navisoft:
  cash-desk:
    pin: ${NAVISOFT_CASHDESK_PIN:}
  eet:
    # Empty value keeps the environment selected in Nastavení; an environment
    # variable can lock deployments to playground or production.
    environment: ${NAVISOFT_EET_ENVIRONMENT:}
    certificate-path: ${NAVISOFT_EET_CERTIFICATE_PATH:}
    certificate-password: ${NAVISOFT_EET_CERTIFICATE_PASSWORD:}
    connect-timeout: ${NAVISOFT_EET_CONNECT_TIMEOUT:2s}
    response-timeout: ${NAVISOFT_EET_RESPONSE_TIMEOUT:2s}

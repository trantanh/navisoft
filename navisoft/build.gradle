plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.1.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.trantanh.navisoft'
version = '11.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.trantanh.navipos.CashDeskApp'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
}

javafx {
    version = '25.0.4'
    modules = [
            'javafx.controls',
            'javafx.fxml',
            'javafx.media'
    ]
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'com.github.anastaciocintra:escpos-coffee:3.0.0'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

springBoot {
    mainClass = application.mainClass
}

// A JavaFX desktop distribution needs its dependency jars next to the app.
// installDist provides that layout; jpackage then adds a platform runtime.
bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveBaseName = 'navisoft'
    manifest {
        attributes(
                'Implementation-Title': 'NaviSoft',
                'Implementation-Version': project.version,
                'Main-Class': application.mainClass.get()
        )
    }
}

def installLibDir = layout.buildDirectory.dir("install/${project.name}/lib")
def jpackageOutputDir = layout.buildDirectory.dir('jpackage')
def jpackageStagingDir = new File(System.getProperty('java.io.tmpdir'), "navisoft-jpackage-${project.version}")
def jpackageAppVersion = version.toString().replace('-SNAPSHOT', '')

tasks.register('cleanJpackage', Delete) {
    delete jpackageOutputDir, jpackageStagingDir
}

tasks.register('clearMacExtendedAttributes', Exec) {
    dependsOn tasks.named('installDist')
    onlyIf { System.getProperty('os.name').toLowerCase().contains('mac') }
    commandLine 'xattr', '-cr', installLibDir.get().asFile
}

tasks.register('jpackageImage', Exec) {
    dependsOn tasks.named('cleanJpackage'), tasks.named('clearMacExtendedAttributes')

    doFirst {
        def launcher = javaToolchains.launcherFor(java.toolchain).get()
        commandLine(
                launcher.metadata.installationPath.file('bin/jpackage').asFile,
                '--type', 'app-image',
                '--name', 'NaviPOS',
                '--input', installLibDir.get().asFile,
                '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--dest', jpackageStagingDir,
                '--app-version', jpackageAppVersion
        )
    }
}

def isMacOs = System.getProperty('os.name').toLowerCase().contains('mac')
def copiedJpackageImage

if (isMacOs) {
    copiedJpackageImage = tasks.register('archiveJpackageImage', Exec) {
        dependsOn tasks.named('jpackageImage')
        doFirst {
            jpackageOutputDir.get().asFile.mkdirs()
            environment 'COPYFILE_DISABLE', '1'
            commandLine 'ditto', '--norsrc', '-c', '-k', '--keepParent',
                    new File(jpackageStagingDir, 'NaviPOS.app'),
                    jpackageOutputDir.get().file('NaviPOS-mac.zip').asFile
        }
    }
} else {
    copiedJpackageImage = tasks.register('copyJpackageImage', Sync) {
        dependsOn tasks.named('jpackageImage')
        from jpackageStagingDir
        into jpackageOutputDir
    }
}

tasks.register('jpackage') {
    group = 'distribution'
    description = 'Creates a self-contained application image for the current platform.'
    dependsOn copiedJpackageImage
}
